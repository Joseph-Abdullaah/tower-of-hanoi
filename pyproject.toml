[project]
name = "tower-of-hanoi"
version = "0.1.0"
description = "Retro CLI that solves the Tower of Hanoi and renders the solution as a video with Remotion."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Joseph Abdullaahi", email = "josephabdullaahi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
hanoi = "hanoi.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanoi"]
